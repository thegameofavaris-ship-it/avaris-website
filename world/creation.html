<noscript><style>.reader-stage,.reader-navigation,.reader-tools{display:none}.reader-shell{height:auto}.canon-fallback{display:block}</style><main class="canon-fallback"><h2 id="myth-title">THE CREATION MYTH</h2><article class="myth-reading" aria-labelledby="myth-title"><div class="myth-beat myth-opening"><p class="myth-paragraph"><span data-i18n="creation.text.00.00">Avaris was not created merely to be a world. It was created in harmony, so that things unlike one another might breathe together as a whole.</span></p></div><div class="myth-beat myth-peoples"><p class="myth-paragraph"><span data-i18n="creation.text.01.00">Beneath the same sky stretch seven kingdoms, divided by seas, mountains, forests, and lands where life learned to exist in different ways. Each has its own earth, its own nature. And yet, for centuries, the seven kingdoms learned to breathe within the same harmony; remaining different from one another while continuing to exist as inseparable parts of the absolute order of the universe.</span></p><p class="myth-paragraph"><span data-i18n="creation.text.02.00">Cities were built where Mother Nature allowed them to stand, and roads wound around the mountains.</span></p><p class="myth-paragraph"><span data-i18n="creation.text.03.00">Before seeking dominion over the lands they inhabited, people learned to understand them.</span></p><p class="myth-sequence"><span data-i18n="creation.text.04.00">Some raised their eyes to the heavens and learned to read the stars.</span><span data-i18n="creation.text.04.01">Some stood before the fire and gave shape to iron.</span><span data-i18n="creation.text.04.02">Some searched for truth within the eyes of others.</span><span data-i18n="creation.text.04.03">Some learned to heal wounds.</span><span data-i18n="creation.text.04.04">Some listened to the song of nature.</span><span data-i18n="creation.text.04.05">Some saw the shadows that souls left behind in the world.</span><span data-i18n="creation.text.04.06">And some learned to forge a new order from the destruction of fire.</span></p><p class="myth-paragraph"><span data-i18n="creation.text.05.00">Yet none sought to become existence itself.</span></p><p class="myth-paragraph myth-whole"><span data-i18n="creation.text.06.00">Together, they were whole.</span></p></div><div class="myth-beat myth-sisters"><p class="myth-paragraph"><span data-i18n="creation.text.07.00">Long before borders, before thrones, and before wars for crowns were written into history in blood, there were seven sisters.</span></p><p class="myth-sequence"><span data-i18n="creation.text.08.00">Their names had not yet become prayers.</span><span data-i18n="creation.text.08.01">No temples had been raised in their honor, nor had their likenesses been carved into stone.</span><span data-i18n="creation.text.08.02">Kings and queens did not yet rule over the lands that had been their gift.</span></p><p class="myth-paragraph"><span data-i18n="creation.text.09.00">It was they who blessed the first harmony of Avaris.</span></p><p class="myth-paragraph"><span data-i18n="creation.text.10.00">Each left a fragment of her own nature within the world.</span></p><p class="myth-paragraph"><span data-i18n="creation.text.11.00">And so seven distinct powers entered the veins of Avaris. But none of these powers was created to stand above the others, nor was any of them meant to gather within a single hand.</span></p></div><div class="myth-beat myth-inheritance"><p class="myth-paragraph"><span data-i18n="creation.text.12.00">Time passed.</span></p><p class="myth-sequence"><span data-i18n="creation.text.13.00">Gifts became inheritance.</span><span data-i18n="creation.text.13.01">Inheritance became duty.</span><span data-i18n="creation.text.13.02">And duty became power.</span></p><p class="myth-paragraph"><span data-i18n="creation.text.14.00">And like all things placed into human hands, power gathered new meanings with time.</span></p><p class="myth-paragraph"><span data-i18n="creation.text.15.00">Generations followed one another. The names of the sisters endured in prayer, while the relics they had left behind passed from one bloodline to the next. Yet truths once known in the same way by all began to change, little by little, with every voice that told them.</span></p></div><div class="myth-beat myth-memory"><p class="myth-sequence"><span data-i18n="creation.text.16.00">A word was forgotten.</span><span data-i18n="creation.text.16.01">A name disappeared into the dust of history.</span><span data-i18n="creation.text.16.02">A victory grew greater in the telling.</span><span data-i18n="creation.text.16.03">A defeat was buried in silence.</span></p><p class="myth-paragraph"><span data-i18n="creation.text.17.00">And with time, the line between history and memory began to fade.</span></p></div><div class="myth-beat myth-present"><p class="myth-paragraph"><span data-i18n="creation.text.18.00">Even today, the roads of the seven kingdoms still meet at the heart of Avaris. Beneath the same roofs, people trade, learn from one another&#x27;s knowledge, carry old tales and poems beyond new borders, and remember wars they themselves never witnessed.</span></p><p class="myth-sequence"><span data-i18n="creation.text.19.00">The temples tell one version of the past.</span><span data-i18n="creation.text.19.01">The libraries tell another.</span><span data-i18n="creation.text.19.02">And some families still whisper stories to their children that can be found in neither.</span></p></div><div class="myth-beat myth-creed"><p class="myth-paragraph"><span data-i18n="creation.text.20.00">Yet a few truths have survived every war, every ruler, and every telling:</span></p><p class="myth-sequence"><span data-i18n="creation.text.21.00">Seven kingdoms.</span><span data-i18n="creation.text.21.01">Seven bloodlines entrusted with seven relics.</span><span data-i18n="creation.text.21.02">Seven names older than any crown.</span></p><p class="myth-paragraph"><span data-i18n="creation.text.22.00">And above them all, the same ancient law—broken and restored since the first day the world was created:</span></p><p class="myth-paragraph myth-last-law"><span data-i18n="creation.text.23.00">One harmony of the universe.</span></p></div></article></main></noscript>
